<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attune cruises</title>
<!--
Cruise console page (Nov 2026). One page, two modes:
  - inside MATLAB (cruise_console: uihtml): status comes in htmlComponent.Data
    (status_json, mode 'matlab'); refresh and open buttons send events to MATLAB
  - in a browser (index.html next to status.js, written by console_publish):
    read-only overview, details and links
-->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d232b; --mut: #667085; --line: #dde1e7; --hover: #eef2f7; --sel: #dbe8ff;
  --done: #2e9d5b; --done-bg: #e3f4ea; --partial: #2f6fd6; --partial-bg: #e2ecfb; --stale: #b7791f; --stale-bg: #fbf0db;
  --todo: #7b4fc9; --todo-bg: #eee6fb; --failed: #c8372d; --failed-bg: #fbe3e1; --missing: #8a94a3; --missing-bg: #eef0f3;
  --unknown: #8a94a3; --unknown-bg: #f3f4f6; --na: #b4bac4; --na-bg: transparent;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --ink: #e5e8ec; --mut: #98a2b3; --line: #2e343e; --hover: #242a33; --sel: #23324d;
    --done: #5fcf8c; --done-bg: #183626; --partial: #7aa7f0; --partial-bg: #1b2a44; --stale: #e3ad55; --stale-bg: #3a2c12;
    --todo: #b293ec; --todo-bg: #2c2140; --failed: #f0776d; --failed-bg: #401c1a; --missing: #8791a0; --missing-bg: #232830;
    --unknown: #8791a0; --unknown-bg: #20242b; --na: #555d69;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1c2027; --ink: #e5e8ec; --mut: #98a2b3; --line: #2e343e; --hover: #242a33; --sel: #23324d;
  --done: #5fcf8c; --done-bg: #183626; --partial: #7aa7f0; --partial-bg: #1b2a44; --stale: #e3ad55; --stale-bg: #3a2c12;
  --todo: #b293ec; --todo-bg: #2c2140; --failed: #f0776d; --failed-bg: #401c1a; --missing: #8791a0; --missing-bg: #232830;
  --unknown: #8791a0; --unknown-bg: #20242b; --na: #555d69;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
.mut { color: var(--mut); }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--line); color: var(--mut); }
.busy { color: var(--stale); font-weight: 600; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
input[type=search], select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--hover); }
button:disabled { opacity: .5; cursor: default; }
label { display: inline-flex; gap: 4px; align-items: center; }
main { flex: 1; display: flex; min-height: 0; }
#gridwrap { flex: 1 1 auto; overflow: auto; min-width: 0; }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; }
.grid th { position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left; font-weight: 600; font-size: 12px; padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.grid td { padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.grid tr.row { cursor: pointer; }
.grid tr.row:hover td { background: var(--hover); }
.grid tr.row.sel td { background: var(--sel); }
.grid tr.pres td.cr { padding-left: 18px; color: var(--mut); }
.grid td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--mut); }
.chip { display: inline-block; min-width: 56px; text-align: center; padding: 1px 6px; border-radius: 5px; font-size: 11.5px; font-weight: 600; }
.s-done { color: var(--done); background: var(--done-bg); }
.s-partial { color: var(--partial); background: var(--partial-bg); }
.s-stale { color: var(--stale); background: var(--stale-bg); }
.s-todo { color: var(--todo); background: var(--todo-bg); }
.s-failed { color: var(--failed); background: var(--failed-bg); }
.s-missing { color: var(--missing); background: var(--missing-bg); }
.s-unknown { color: var(--unknown); background: var(--unknown-bg); }
.s-na { color: var(--na); background: var(--na-bg); font-weight: 400; }
aside { flex: 0 0 440px; max-width: 46%; overflow-y: auto; overflow-x: hidden; overflow-wrap: anywhere; border-left: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
aside h2 { font-size: 15px; margin: 0 0 2px; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mut); margin: 16px 0 6px; }
.steps { width: 100%; border-collapse: collapse; }
.steps td { padding: 5px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.steps td:first-child { width: 92px; font-weight: 600; }
.steps .why { margin-top: 2px; }
.steps .sub { color: var(--mut); font-size: 12px; margin-top: 2px; word-break: break-word; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links a, .links button { font-size: 12px; }
a { color: var(--partial); }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; }
dl.kv dt { color: var(--mut); }
dl.kv dd { margin: 0; word-break: break-word; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px; border-top: 1px solid var(--line); background: var(--panel); font-size: 12px; }
.empty { padding: 40px; text-align: center; color: var(--mut); }
@media (max-width: 820px) {
  main { flex-direction: column; }
  aside { flex: 0 0 auto; max-width: none; border-left: 0; border-top: 1px solid var(--line); }
  .ctl { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <h1>Attune cruise processing</h1>
  <span id="made" class="mut"></span>
  <span id="mode" class="badge"></span>
  <span id="busy" class="busy"></span>
  <div class="ctl">
    <input id="q" type="search" placeholder="cruise" size="10" aria-label="filter cruises">
    <select id="sample" aria-label="sample type">
      <option value="">underway and preserved</option>
      <option value="underway">underway</option>
      <option value="preserved">preserved</option>
    </select>
    <select id="stfilter" aria-label="state filter">
      <option value="">all rows</option>
      <option value="work">needs work</option>
      <option value="stale">has stale</option>
      <option value="failed">has failed</option>
      <option value="todo">review to do</option>
    </select>
    <label><input id="hidena" type="checkbox" checked> hide rows without files</label>
    <button id="refreshAll" class="mat" title="scan every cruise again (about 2 minutes)">Refresh all</button>
  </div>
</header>
<main>
  <div id="gridwrap"><table class="grid" id="grid"></table></div>
  <aside id="detail"><div class="empty">Select a cruise</div></aside>
</main>
<div class="legend" id="legend"></div>

<script src="status.js" onerror="void 0"></script>
<script>
'use strict';
const STEPS = ['files', 'beads', 'bead_review', 'classify', 'class_review', 'volume', 'table', 'metadata'];
const HEAD = { files: 'files', beads: 'beads', bead_review: 'bead review', classify: 'classify', class_review: 'class review', volume: 'volume', table: 'table', metadata: 'metadata' };
const LABEL = { done: 'done', partial: 'partial', stale: 'stale', todo: 'to review', failed: 'failed', missing: '–', unknown: '?', na: '' };
const MEAN = { done: 'output current', partial: 'some files not done', stale: 'an input changed after it', todo: 'a review needs a person', failed: 'last run failed', missing: 'not there', unknown: 'made before step records', na: 'no FCS files of this sample type' };
let D = null, comp = null, sel = null, rows = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const key = c => c.cruise + '|' + c.sample;
const fmtd = s => s ? s.replace('T', ' ').slice(0, 16) : '';
const state = (c, s) => (c.steps.find(x => x.step === s) || {}).state || 'missing';
const MAT = () => comp && D && D.mode === 'matlab';
const refreshing = () => /^refreshing/.test((D && D.busy) || '');

function load(d) {
  D = typeof d === 'string' ? JSON.parse(d) : d;
  if (!D || !Array.isArray(D.cruises)) { D = { cruises: [] }; }
  D.cruises.forEach(c => { if (!Array.isArray(c.steps)) c.steps = c.steps ? [c.steps] : []; if (!Array.isArray(c.archive)) c.archive = c.archive ? [c.archive] : []; });
  $('made').textContent = D.made ? 'status checked ' + fmtd(D.made) : '';
  $('mode').textContent = MAT() ? 'MATLAB' : 'read-only';
  $('mode').title = MAT() ? 'refresh and open go to MATLAB' : 'open in MATLAB with cruise_console to refresh status';
  $('busy').textContent = D.busy || '';
  document.querySelectorAll('.mat').forEach(b => { b.style.display = MAT() ? '' : 'none'; b.disabled = refreshing(); });
  draw();
}

function visible() {
  const q = $('q').value.trim().toLowerCase(), smp = $('sample').value, f = $('stfilter').value, hide = $('hidena').checked;
  return D.cruises.filter(c => {
    if (q && !c.cruise.toLowerCase().includes(q)) return false;
    if (smp && c.sample !== smp) return false;
    const st = STEPS.map(s => state(c, s));
    if (hide && st.every(x => x === 'na')) return false;
    if (f === 'work' && !c.needs_work) return false;
    if (f && f !== 'work' && !st.includes(f)) return false;
    return true;
  });
}

function draw() {
  rows = visible();
  let h = '<thead><tr><th>cruise</th><th>sample</th>' + STEPS.map(s => `<th>${HEAD[s]}</th>`).join('') + '<th title="sample files classified / sample files">classified</th><th>archive</th></tr></thead><tbody>';
  for (const c of rows) {
    const k = key(c);
    h += `<tr class="row${c.sample === 'preserved' ? ' pres' : ''}${k === sel ? ' sel' : ''}" data-k="${esc(k)}"><td class="cr">${esc(c.cruise)}</td><td class="mut">${esc(c.sample)}</td>`;
    for (const s of STEPS) {
      const x = c.steps.find(y => y.step === s) || { state: 'missing', reason: '' };
      h += `<td><span class="chip s-${x.state}" title="${esc(HEAD[s] + ': ' + (x.reason || MEAN[x.state] || ''))}">${LABEL[x.state] ?? x.state}</span></td>`;
    }
    const n = c.counts || {};
    h += `<td class="num">${n.n_sample ? `${n.n_classified ?? 0} / ${n.n_sample}` : ''}</td><td class="mut">${c.archive.length ? '✓' : ''}</td></tr>`;
  }
  h += '</tbody>';
  $('grid').innerHTML = rows.length ? h : '<tbody><tr><td class="empty">No cruises match</td></tr></tbody>';
  const n = D.cruises.filter(c => c.needs_work).length;
  $('legend').innerHTML = Object.keys(LABEL).filter(s => s !== 'na').map(s => `<span class="chip s-${s}" title="${esc(MEAN[s])}">${LABEL[s]}</span> <span class="mut">${MEAN[s]}</span>`).join(' &nbsp;') +
    ` <span style="margin-left:auto" class="mut">${rows.length} rows shown · ${n} of ${D.cruises.length} need work</span>`;
  detail();
}

function link(path, text) {
  if (!path) return '';
  if (MAT()) return `<button data-open="${esc(path)}">${esc(text)}</button>`;
  const u = 'file:///' + String(path).replace(/\\/g, '/').replace(/^\/+/, '');
  return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(text)}</a>`;
}

function detail() {
  const c = D.cruises.find(x => key(x) === sel);
  if (!c) { $('detail').innerHTML = '<div class="empty">Select a cruise</div>'; return; }
  const n = c.counts || {};
  let h = `<h2>${esc(c.cruise)} <span class="mut">${esc(c.sample)}</span></h2><div class="mut">checked ${fmtd(c.checked)}</div>`;
  if (MAT()) h += `<div style="margin-top:8px"><button data-refresh="1" ${refreshing() ? 'disabled' : ''}>Refresh this cruise</button></div>`;
  h += '<h3>Steps</h3><table class="steps">';
  for (const s of STEPS) {
    const x = c.steps.find(y => y.step === s) || { state: 'missing' };
    const last = x.last || {};
    let sub = [];
    if (x.date) sub.push('output ' + fmtd(x.date));
    if (last.finished) sub.push(`last run ${fmtd(last.finished)}${last.ok === false ? ' (failed' + (last.message ? ': ' + last.message : '') + ')' : ''}`);
    if (x.detail) sub.push(x.detail);
    h += `<tr><td>${HEAD[s]}</td><td><span class="chip s-${x.state}">${LABEL[x.state] || x.state || ''}</span><div class="why">${esc(x.reason || '')}</div>${sub.length ? `<div class="sub">${esc(sub.join(' · '))}</div>` : ''}</td></tr>`;
  }
  h += '</table><h3>Open</h3><div class="links">';
  const L = c.links || {};
  h += link(L.outpath, 'output folder');
  if (state(c, 'bead_review') !== 'missing' && state(c, 'bead_review') !== 'na') h += link(L.bead_review, 'bead review');
  if (['done', 'todo', 'stale'].includes(state(c, 'class_review'))) {
    h += link(L.class_review, 'class review');
    if (c.sample === 'preserved') h += link(L.hbac_review, 'SYBR run review');
  }
  h += '</div><h3>Counts</h3><dl class="kv">';
  const kv = [['FCS files', n.n_fcs], ['sample files', n.n_sample], ['classified', n.n_classified], ['failed', n.n_failed], ['with volume', n.n_volume], ['reviewed', n.n_reviewed], ['excluded in review', n.n_excluded]];
  for (const [k, v] of kv) if (v !== undefined && v !== null) h += `<dt>${k}</dt><dd>${v}</dd>`;
  h += `<dt>output</dt><dd>${esc(c.outpath)}</dd>`;
  h += `<dt>archive</dt><dd>${c.archive.length ? esc(c.archive.join(', ')) : 'none'}</dd></dl>`;
  const br = c.bead_review || {};
  if (br.message) h += `<h3>Bead review</h3><div class="sub">${esc(br.message)}</div>`;
  $('detail').innerHTML = h;
}

// events
$('grid').addEventListener('click', e => {
  const tr = e.target.closest('tr.row'); if (!tr) return;
  sel = tr.dataset.k; draw();
});
$('detail').addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o && MAT()) { comp.sendEventToMATLAB('open', o.dataset.open); return; }
  if (e.target.closest('[data-refresh]') && MAT()) {
    const c = D.cruises.find(x => key(x) === sel);
    if (c) comp.sendEventToMATLAB('refresh', { cruise: c.cruise, sample: c.sample });
  }
});
$('refreshAll').addEventListener('click', () => { if (MAT()) comp.sendEventToMATLAB('refresh', { cruise: '', sample: '' }); });
for (const id of ['q', 'sample', 'stfilter', 'hidena']) $(id).addEventListener('input', draw);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || !rows.length) return;
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  let i = rows.findIndex(c => key(c) === sel);
  i = Math.max(0, Math.min(rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
  sel = key(rows[i]); draw();
  document.querySelector('tr.row.sel')?.scrollIntoView({ block: 'nearest' });
});

// MATLAB (uihtml) calls setup; a browser uses window.STATUS from status.js
function setup(htmlComponent) {
  comp = htmlComponent;
  htmlComponent.addEventListener('DataChanged', () => load(htmlComponent.Data));
  if (htmlComponent.Data) load(htmlComponent.Data);
}
window.addEventListener('DOMContentLoaded', () => {
  if (!comp) {
    if (window.STATUS) load(window.STATUS);
    else { D = { cruises: [] }; $('detail').innerHTML = '<div class="empty">No status.js next to this page. Run cruise_status_all in MATLAB, or open the console with cruise_console.</div>'; draw(); }
  }
});
</script>
</body>
</html>
